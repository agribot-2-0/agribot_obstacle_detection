#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator
from dynamic_reconfigure.parameter_generator_catkin import int_t, str_t, bool_t, double_t

PACKAGE = "agribot_obstacle_detection"

gen = ParameterGenerator()
gen.add("objects_target_frame_id",                            str_t,    0, "Target frame",                            "base_footprint")



vis_group = gen.add_group("a Debug")
vis_group.add("debug_publish_processing_time",                  bool_t,   0, "[Visualization] Publish processing time", True)
vis_group.add("debug_print_processing_time",                    bool_t,   0, "[Visualization] Print processing time",   True)

exit(gen.generate(PACKAGE, "agribot_obstacle_detection", "PointCloudLateFusion"))
