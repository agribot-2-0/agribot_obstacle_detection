#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator
from dynamic_reconfigure.parameter_generator_catkin import int_t, str_t, bool_t, double_t

PACKAGE = "agribot_obstacle_detection"

gen = ParameterGenerator()
gen.add("objects_target_frame_id",                            str_t,    0, "Target frame",                                    "base_footprint")

# VoxelGrid filter
voxel_group = gen.add_group("a VoxelGrid filter")
voxel_group.add("use_vgf",                                  bool_t, 0,    "[VoxelGrid filter] Use VoxelGrid filter",           True)
voxel_group.add("vgf_resolution",                           double_t, 0,  "[VoxelGrid filter] Filter resolution",            0.07,   0.0,  2.0)
voxel_group.add("vgf_min_x",                                double_t, 0,  "[VoxelGrid filter] Minimal x cutoff distance",    0.05,   0.0,  200.0)
voxel_group.add("vgf_max_x",                                double_t, 0,  "[VoxelGrid filter] Maximal x cutoff distance",    10.0,   0.0,  200.0)



# Outlier removal
outlier_group = gen.add_group("b Outlier removal")
outlier_removal_method_enum = gen.enum([ gen.const("none",       int_t, 0, "Do not remove outliers"),
                                    gen.const("radius",  int_t, 1, "Radius outlier removal"),
                                    gen.const("statistical",  int_t, 2, "Statistical outlier removal")],
                                "Outlier removal type")

outlier_group.add("outlier_removal_method",                   int_t,    0, "[OutlierRemoval] Method selection",                     0,      0,    2, edit_method=outlier_removal_method_enum)

ror_group = outlier_group.add_group("b1 Radius outlier removal")
ror_group.add("ror_neighbours_n",                           int_t, 0, "[RadiusOutlierRemoval] Minimal number of neighbors", 10, 0, 100)
ror_group.add("ror_radius",                                 double_t, 0, "[RadiusOutlierRemoval] Search radius", 0.3, 0.0, 3.0)

sor_group = outlier_group.add_group("b2 Statistical outlier removal")
sor_group.add("sor_neighbours_n",                           int_t, 0, "[StatisticalOutlierRemoval] Minimal number of neighbors", 50, 0, 1000)
sor_group.add("sor_stddev_mul",                                 double_t, 0, "[StatisticalOutlierRemoval] Stddev multiplier", 1.0, 0.0, 10.0)



# Plane segmentation
seg_group = gen.add_group("c Plane segmentation")
seg_group.add("segmentation_iterations_n",                             int_t,    0, "[Segmentation] Max. number of iterations",        300,    1,    10000)
seg_group.add("segmentation_distance_threshold",                     double_t, 0, "[Segmentation] Distance threshold for plane fit", 0.1,    0.0,  3.0)



# Clustering
clustering_group = gen.add_group("d Clustering")
clustering_method_enum = gen.enum([ gen.const("euclidean",       int_t, 0, "Euclidean clustering"),
                                    gen.const("region_growing",  int_t, 1, "Region growing clustering")],
                                "Clustering type")
clustering_group.add("clustering_method",                   int_t,    0, "[Clustering] Method selection",                     0,      0,    1, edit_method=clustering_method_enum)

clustering_group.add("clustering_min_cluster_size",                      int_t,    0, "[Clustering] Min. cluster size" , 20, 0, 100000)
clustering_group.add("clustering_max_cluster_size",                      int_t,    0, "[Clustering] Max. cluster size", 10000, 0, 100000)

# Euclidean clustering
ec_group = clustering_group.add_group("d1 Euclidean clustering")
ec_group.add("ec_cluster_tolerance",                           double_t, 0, "[EuclideanClustering] Cluster tolerance", 0.16, 0.0, 5.0)

# Region growing clustering
rgc_group = clustering_group.add_group("d2 RegionGrowing clustering")

normal_estimation_group = rgc_group.add_group("Normal estimation")
normal_estimation_group.add("rgc_normal_estimation_neighbours_n",                           int_t, 0, "[NormalEstimation] Number of neighbors for normal estimation", 50, 0, 1000)

rgc_group.add("rgc_neighbours_n",                           int_t, 0, "[RegionGrowingClustering] Number of neighbors for ...TODO", 30, 0, 1000)
rgc_group.add("rgc_smoothness_angle_threshold",                           double_t, 0, "[RegionGrowingClustering] Smoothness angle threshold", 3.0, 0.0, 100.0)
rgc_group.add("rgc_curvature_threshold",                           double_t, 0, "[EuclideanClustering] Cluster tolerance", 1.0, 0.0, 100.0)




vis_group = gen.add_group("e Visualization")
vis_group.add("vis_publish_ground_point_cloud",                           bool_t, 0, "[Visualization] Publish ground cloud", True)
vis_group.add("vis_publish_objects_point_cloud",                           bool_t, 0, "[Visualization] Publish obstacles cloud", True)
vis_group.add("vis_publish_processing_time",                           bool_t, 0, "[Visualization] Publish processing time", True)
vis_group.add("vis_print_processing_time",                           bool_t, 0, "[Visualization] Print processing time", False)

exit(gen.generate(PACKAGE, "agribot_obstacle_detection", "LidarPointCloudPipeline"))
