#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator
from dynamic_reconfigure.parameter_generator_catkin import int_t, str_t, bool_t, double_t

PACKAGE = "agribot_obstacle_detection"

gen = ParameterGenerator()

gen.add("publish_processing_time", bool_t, 0, "Publish processing time", True)
gen.add("print_processing_time", bool_t, 0, "Print processing time", False)

gen.add("robot_safety_zone_length",         double_t, 0,  "Length of safety zone for robot pose", 4.0, 0.0, 10.0)
gen.add("robot_safety_zone_width",          double_t, 0,  "Width of safety zone for robot pose", 2.0, 0.0, 10.0)
gen.add("cart_safety_zone_length",         double_t, 0,  "Length of safety zone for cart pose", 2.2, 0.0, 10.0)
gen.add("cart_safety_zone_width",          double_t, 0,  "Width of safety zone for cart pose", 2.0, 0.0, 10.0)
gen.add("min_path_safety_zone_length",      double_t, 0,  "Length of safety zone for furthest path point", 2.8, 0.0, 10.0)
gen.add("min_path_safety_zone_width",       double_t, 0,  "Width of safety zone for furthest path point", 1.3, 0.0, 10.0)
gen.add("max_path_safety_zone_length",      double_t, 0,  "Length of safety zone for closest path point", 4.0, 0.0, 10.0)
gen.add("max_path_safety_zone_width",       double_t, 0,  "Width of safety zone for closest path point", 1.8, 0.0, 10.0)
gen.add("path_safety_zone_horizon",         double_t, 0,  "Max distance between robot and path point for polygon generation", 3.5, 0.0, 10.0)

exit(gen.generate(PACKAGE, "agribot_obstacle_detection", "ObstaclesArbiter"))
