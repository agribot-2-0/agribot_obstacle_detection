#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator
from dynamic_reconfigure.parameter_generator_catkin import int_t, str_t, bool_t, double_t

PACKAGE = "agribot_obstacle_detection"

gen = ParameterGenerator()

gen.add("eps_angle", double_t, 0,  "EPS angle for parallel plane segmentation [rad]", 0.0372664626, 0.0, 3.14)
gen.add("parallel_axis_x", double_t, 0,  "Parallel axis x", 0.0, 0.0, 1.0)
gen.add("parallel_axis_y", double_t, 0,  "Parallel axis y", 0.0, 0.0, 1.0)
gen.add("parallel_axis_z", double_t, 0,  "Parallel axis z", 1.0, 0.0, 1.0)
gen.add("seg_distance_threshold", double_t, 0,  "Plane/line segmentation distance threshold", 0.05, 0.0, 1.0)
gen.add("seg_max_iterations", int_t, 0,  "Plane/line segmentation max iterations", 1000, 0, 10000)

model_type_enum = gen.enum([
                            gen.const("plane",                  int_t, 0,   "Plane segmentation"),
                            gen.const("normal_plane",           int_t, 11,  "Normal plane segmentation"),
                            gen.const("parallel_plane",         int_t, 15,  "Parallel plane segmentation"),
                            gen.const("normal_parallel_plane",  int_t, 16,  "Normal parallel plane segmentation"),
                            ], "Model type enum")

method_type_enum = gen.enum([
                            gen.const("ransac",                 int_t, 0,   "RANdom SAmple Consensus"),
                            gen.const("lmeds",                  int_t, 1,   "Least Median of Squares"),
                            gen.const("msac",                   int_t, 2,   "M-Estimator SAmple Consensus"),
                            gen.const("rransac",                int_t, 3,   "Randomized RANSAC"),
                            gen.const("rmsac",                  int_t, 4,   "Randomized MSAC"),
                            gen.const("mlesac",                 int_t, 5,   "Maximum LikeLihood Estimation SAmple Consensus"),
                            gen.const("prosac",                 int_t, 6,   "PROgressive SAmple Consensus"),
                            ], "Method type enum")


gen.add("seg_model_type", int_t, 0,  "Segmentation model type", 15, 0, 16, edit_method=model_type_enum)
gen.add("seg_method_type", int_t, 0,  "Segmentation method type", 0, 0, 6, edit_method=method_type_enum)

exit(gen.generate(PACKAGE, "agribot_obstacle_detection", "ObstaclesArbiter"))
