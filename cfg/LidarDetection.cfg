#!/usr/bin/env python
PACKAGE = "agribot_obstacle_detection"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("cloud_target_frame_id",                          str_t,    0, "Target frame", "base_footprint")

gen.add("voxel_grid_filter_resolution",                   double_t, 0, "[VoxelGrid filter] Filter resolution", 0.07)
gen.add("distance_filter_min_x",                          double_t, 0, "[Distance filter] Minimal x distance", 0.05)
gen.add("distance_filter_max_x",                          double_t, 0, "[Distance filter] Maximal x distance", 10.0)

gen.add("segmentation_max_iterations",                    int_t,    0, "[Segmentation] Max. number of iterations", 300)
gen.add("segmentation_distance_threshold",                double_t, 0, "[Segmentation] Distance threshold", 0.1)

clustering_type = gen.enum([ gen.const("euclidean",       int_t, 0, "Euclidean clustering"),
                             gen.const("region_growing",  int_t, 1, "Region growing clustering")],
                            "Clustering type")
gen.add("clustering_method",                              int_t, 0, "Clustering method selection", 0, 0, 1, edit_method=clustering_type)

gen.add("clustering_min_cluster_size",                    int_t,    0, "[Clustering] Min. cluster size" , 20)
gen.add("clustering_max_cluster_size",                    int_t,    0, "[Clustering] Max. cluster size", 10000)

gen.add("ec_cluster_tolerance",                           double_t, 0, "[EuclideanClustering] Cluster tolerance", 0.16)

exit(gen.generate(PACKAGE, "agribot_obstacle_detection", "LidarDetection"))
