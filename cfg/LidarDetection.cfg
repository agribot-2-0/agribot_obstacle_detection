#!/usr/bin/env python
PACKAGE = "agribot_obstacle_detection"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("cloud_target_frame_id",                          str_t,    0, "Target frame", "base_footprint")

gen.add("distance_filter_distance_threshold",             double_t, 0, "[Distance filter] Distance threshold", 10.0)
gen.add("voxel_grid_filter_resolution",                   double_t, 0, "[VoxelGrid filter] Filter resolution", 0.15)

gen.add("segmentation_max_iterations",                    int_t,    0, "[Segmentation] Max. number of iterations", 300)
gen.add("segmentation_distance_threshold",                double_t, 0, "[Segmentation] Distance threshold", 0.1)
gen.add("segmentation_use_passthrough_filter",            bool_t,   0, "[Segmentation] Apply passthrough filter", False)
gen.add("segmentation_passthrough_filter_cutoff_ratio",   double_t, 0, "[Segmentation] Passthrough filter cutoff ratio", 0.1)

gen.add("clustering_cluster_tolerance",                   double_t, 0, "[Clustering] Cluster tolerance", 0.2)
gen.add("clustering_min_cluster_size",                    int_t,    0, "[Clustering] Min. cluster size" , 30)
gen.add("clustering_max_cluster_size",                    int_t,    0, "[Clustering] Max. cluster size", 10000)

exit(gen.generate(PACKAGE, "agribot_obstacle_detection", "LidarDetection"))